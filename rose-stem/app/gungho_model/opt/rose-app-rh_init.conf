[namelist:base_mesh]
f_lat_deg=45.0
fplane=.false.
geometry='planar'

[namelist:extrusion]
domain_height=20.0e3
number_of_layers=40

[namelist:formulation]
l_multigrid=.false.
moisture_formulation='traditional'
rotating=.false.

[namelist:helmholtz_solver]
fail_on_non_converged=.true.
gcrk=18
method='bicgstab'
monitor_convergence=.true.
preconditioner='tridiagonal'
si_pressure_a_tol=1.0e-6

[namelist:idealised]
test='specified_profiles'

[namelist:initial_temperature]
profile_data=300.0,240.0
profile_heights=5.0e3,12.0e3
profile_size=2
profile_variable='absolute'

[namelist:initial_vapour]
profile_data=0.8,0.3,0.4,0.0
profile_heights=2.0e3,10.0e3,14.0e3,16.0e3
profile_size=4
profile_variable='rh'

[namelist:initial_wind]
profile='constant_uv'
smp_init_wind=.true.

[namelist:io]
diagnostic_frequency=10

[!!namelist:multigrid]

[namelist:partitioning]
partitioner='planar'

[namelist:physics]
limit_drag_incs=.false.
sample_physics_scalars=.false.
sample_physics_winds=.false.

[namelist:section_choice]
aerosol='none'
boundary_layer='none'
chemistry='none'
cloud='none'
dynamics='none'
external_forcing=.false.
methane_oxidation=.false.
orographic_drag='none'
radiation='none'
spectral_gwd='none'
stochastic_physics='none'
surface='none'

[namelist:transport]
panel_edge_treatment='none'
